name: GitHub Metrics 3D & Isometric Visualizer

on:
  schedule:
    - cron: "0 0 * * *" # Daily at 00:00 UTC (07:00 WIB)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    name: Render GitHub Metrics SVG
    steps:
      - name: Generate GitHub Metrics SVG
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_SECRET }}
          user: krisnabagusr
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Jakarta
          config_theme: tokyonight
          filename: github-metrics.svg
          
          # 3D Isometric Calendar Plugin
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # Language Breakdown Plugin
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%

          # Habits & Active Coding Hours Plugin
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes

          # Virtual Pets Plugin (Cat Mascot)
          plugin_pets: yes
          plugin_pets_kind: cat
